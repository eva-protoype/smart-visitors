name: Publish interface links

on:
  push:
    branches: [main]
    paths:
      - "deploy/github-pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate home server URL
        env:
          HOME_SERVER_URL: ${{ vars.HOME_SERVER_URL }}
        run: |
          test -n "$HOME_SERVER_URL"
          case "$HOME_SERVER_URL" in
            https://*) ;;
            *) echo "HOME_SERVER_URL must use HTTPS" >&2; exit 1 ;;
          esac
      - name: Build Pages site
        env:
          HOME_SERVER_URL: ${{ vars.HOME_SERVER_URL }}
        run: |
          mkdir -p _site
          cp -R deploy/github-pages/. _site/
          find _site -name index.html -type f -print0 | while IFS= read -r -d '' file; do
            sed -i "s|__HOME_SERVER_URL__|${HOME_SERVER_URL%/}|g" "$file"
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
