services:
  backend:
    build: ./backend
    container_name: smart-visitors-backend
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=sqlite:///./data/smart_visitors.db
      - AI_ARTIFACT_DIR=./artifacts
    volumes:
      - backend-data:/app/artifacts
      # Persist the SQLite file itself — without this, recreating the
      # backend container loses users, passes, and the audit log.
      - backend-db:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: smart-visitors-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  backend-db:
